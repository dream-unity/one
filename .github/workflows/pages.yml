name: Deploy Dream Unity

on:
  # Push publishes only after the owner selects Pages Source: GitHub Actions.
  push:
    branches: [main]
  # Until that switch, follow successful legacy publishing with the staged release.
  # The legacy publisher still exposes an intermediate raw release during this period.
  workflow_run:
    workflows: ['pages build and deployment', 'pages-build-deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  preflight:
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      source_commit: ${{ steps.revision.outputs.source_commit }}
      deploy: ${{ steps.publisher.outputs.deploy }}
      build_type: ${{ steps.publisher.outputs.build_type }}
    steps:
      - name: Admit only the current trusted main revision
        id: revision
        env:
          DREAMUNITY_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const selected = process.env.DREAMUNITY_SOURCE_COMMIT;
          if (!/^[a-f0-9]{40}$/.test(selected || '')) throw new Error('Release revision must be an exact Git commit.');
          const current = execFileSync('git', ['ls-remote', 'https://github.com/dream-unity/one.git', 'refs/heads/main'],
            { encoding: 'utf8', timeout: 10000 }).trim().split(/\s+/)[0];
          if (current !== selected) throw new Error('A newer main revision exists; this stale completion cannot deploy.');
          appendFileSync(process.env.GITHUB_OUTPUT, `source_commit=${selected}\n`);
          NODE

      - name: Check out the admitted revision for publisher selection
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.source_commit }}
          persist-credentials: false

      - name: Use the supported JavaScript runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Select the publisher from the actual Pages source
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/select-pages-publisher.mjs

  deploy:
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    concurrency:
      group: dream-unity-pages
      cancel-in-progress: false
      queue: max
    env:
      DREAMUNITY_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Use the supported JavaScript runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify current and prototype behavior
        run: npm test

      - name: Stage permitted public files
        run: node scripts/stage-public-site.mjs

      - name: Install pinned browser verification runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/dreamunity-browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/dreamunity-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Verify site dictation before publishing
        timeout-minutes: 4
        env:
          NODE_PATH: ${{ runner.temp }}/dreamunity-browser/node_modules
        run: node scripts/verify-site-dictation-browser.cjs

      - name: Upload static experience
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .public-site

      - name: Recheck the active Pages publisher before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          DREAMUNITY_EXPECTED_PAGES_BUILD_TYPE: ${{ needs.preflight.outputs.build_type }}
        run: node scripts/select-pages-publisher.mjs

      - name: Recheck the exact current revision before publishing
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const selected = process.env.DREAMUNITY_SOURCE_COMMIT;
          const checkedOut = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const current = execFileSync('git', ['ls-remote', 'origin', 'refs/heads/main'],
            { encoding: 'utf8', timeout: 10000 }).trim().split(/\s+/)[0];
          if (checkedOut !== selected || current !== selected) throw new Error('Release superseded; no stale publication is permitted.');
          NODE

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify the published prototype in Chromium
        timeout-minutes: 4
        env:
          NODE_PATH: ${{ runner.temp }}/dreamunity-browser/node_modules
          DREAMUNITY_EXPECTED_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: node scripts/verify-prototype-browser.cjs

      - name: Verify the coordinated Earth runtime in Chromium
        timeout-minutes: 3
        env:
          NODE_PATH: ${{ runner.temp }}/dreamunity-browser/node_modules
          DREAMUNITY_EXPECTED_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          DREAMUNITY_EXPECTED_EARTH_COMMIT: 14856f8eb68858620b0c4147766e14f538fb0f2f
          DREAMUNITY_KEYLESS_EARTH_BUILD_AT: 2026-10-03T11:38:43.353Z
        run: node scripts/verify-earth-embed-browser.cjs

      - name: Preserve published browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/stage5-browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve site dictation verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-dictation-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/site-dictation-browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve coordinated Earth verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-earth-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/astra-earth-browser
          if-no-files-found: ignore
          retention-days: 7
