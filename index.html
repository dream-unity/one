<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ebe4d5" />
  <meta name="description" content="Enter Dream Unity: Dream Machine, Dream Maker and Dream World." />
  <title>Dream Unity</title>
  <link rel="preload" as="image" href="./assets/dream-unity-portals-refined.webp" type="image/webp" />
  <link rel="stylesheet" href="./styles.css?v=breath-interface-20260919" />
</head>
<body>
  <main class="portal-page">
    <nav class="portal-artwork" aria-label="Choose a Dream Unity portal">
      <h1 class="portal-title">Dream Unity</h1>
      <img class="portal-image" src="./assets/dream-unity-portals-refined.webp" width="1254" height="1254" alt="" fetchpriority="high" draggable="false" />

      <button class="portal portal-card portal--machine" type="button" data-world="machine" aria-label="Open Dream Machine" aria-controls="world-panel" aria-expanded="false">
        <span class="portal-caption"><span>Dream<br />Machine</span></span>
      </button>
      <button class="portal portal-card portal--maker" type="button" data-world="maker" aria-label="Open Dream Maker" aria-controls="world-panel" aria-expanded="false">
        <span class="portal-caption"><span>Dream<br />Maker</span></span>
      </button>
      <button class="portal portal-card portal--reality" type="button" data-world="world" aria-label="Open Dream World" aria-controls="world-panel" aria-expanded="false">
        <span class="portal-caption"><span>Dream<br />World</span></span>
      </button>
    </nav>
  </main>

  <dialog id="world-panel" class="world-panel" aria-labelledby="world-title" aria-describedby="world-description" aria-hidden="true">
    <p id="world-kicker"></p>
    <h2 id="world-title" tabindex="-1"></h2>
    <p id="world-description"></p>
    <div id="world-steps" class="world-steps"></div>
    <button id="return-unity" type="button">Back to home</button>
  </dialog>

  <noscript><p class="no-script"><a href="./portals/">Explore all Dream Unity portals</a></p></noscript>
  <script defer src="./portal-subnav.js?v=breath-interface-20260919"></script>
  <script defer src="./home-dialog.js?v=breath-interface-20260919"></script>
</body>
</html>
